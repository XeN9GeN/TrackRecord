services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackrecord}
      POSTGRES_USER: ${POSTGRES_USER:-trackrecord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The host name is the Compose service, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-trackrecord}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-trackrecord}
      MEDIA_ROOT: /app/media
      STATIC_ROOT: /app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro
      - media:/media:ro

volumes:
  postgres_data:
  media:
  staticfiles:
