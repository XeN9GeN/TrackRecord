# nginx site for TrackRecord. Replace SERVER_NAME, then run certbot --nginx to add HTTPS.
# Install: see docs/DEPLOY.md.
server {
    listen 80;
    server_name SERVER_NAME;

    client_max_body_size 25m;

    location /static/ {
        alias /home/mannobody/TrackRecord/staticfiles/;
    }

    # Attachments are served only after the auth check in Django, via X-Accel-Redirect (ADR-0007).
    location /protected-media/ {
        internal;
        alias /home/mannobody/TrackRecord/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
