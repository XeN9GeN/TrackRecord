# nginx configuration for the Docker Compose deployment.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Resolve Compose service names at request time; web may become available
    # after nginx starts or be recreated during an update.
    resolver 127.0.0.11 ipv6=off valid=30s;

    client_max_body_size 25m;

    location /static/ {
        alias /staticfiles/;
    }

    # Attachments are served only after the auth check in Django, via X-Accel-Redirect (ADR-0007).
    location /protected-media/ {
        internal;
        alias /media/;
    }

    location / {
        set $web_upstream http://web:8000;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
