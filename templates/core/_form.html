{% load i18n %}
<form method="post" class="form">
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}
  {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
    {{ field.errors }}
  {% endfor %}
  <div><button type="submit" class="button primary">{{ submit_label }}</button></div>
</form>
