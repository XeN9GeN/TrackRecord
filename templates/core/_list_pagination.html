{% load i18n %}
{% if page.has_other_pages %}
  <nav class="filters pagination" aria-label="{% translate 'Pagination' %}">
    {% if page.has_previous %}
      <a href="{% querystring page=1 %}">{% translate "First" %}</a>
      <a href="{% querystring page=page.previous_page_number %}">← {% translate "Previous" %}</a>
    {% endif %}
    <span class="muted" aria-current="page">{{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
      <a href="{% querystring page=page.next_page_number %}">{% translate "Next" %} →</a>
      <a href="{% querystring page=page.paginator.num_pages %}">{% translate "Last" %}</a>
    {% endif %}
  </nav>
{% endif %}
