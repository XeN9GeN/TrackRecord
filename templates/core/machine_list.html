{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Machines" %}{% endblock %}

{% block content %}
<div class="row">
  <h1>{% translate "Machines" %}</h1>
  {% if perms.core.add_machine %}
    <a class="button" href="{% url 'admin:core_machine_add' %}">{% translate "Add machine" %}</a>
  {% endif %}
</div>

<form method="get" class="search">
  <input type="search" name="q" value="{{ query }}" placeholder="{% translate 'Number, model, owner or region' %}">
  <button type="submit" class="button">{% translate "Find" %}</button>
</form>

<section class="card">
  {% include "core/_machine_table.html" with show_owner=True %}
</section>
{% endblock %}
